name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pillow
      - name: 跑测试
        run: python -m unittest discover -s tests -t . -v
      - name: 冒烟：出图 + 出 JSON
        run: |
          python -m quota_glance render --demo -o /tmp/x.png
          python -m quota_glance json --demo -o /tmp/x.json
          python -c "import json;d=json.load(open('/tmp/x.json'));assert d['schema']=='quota-glance/1';assert len(d['providers'])==4;print('ok')"
